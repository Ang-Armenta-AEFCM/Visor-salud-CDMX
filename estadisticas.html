<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estadísticas de Salud Escolar</title><link rel="stylesheet" href="style.css"><style>body{padding:0}.stats{max-width:1200px;margin:24px auto;padding:0 18px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.tablebox{background:#fff;border:1px solid #d6e0e6;border-radius:9px;padding:16px}.card strong{font-size:28px;color:#15324a;display:block}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #e1e8ec;font-size:13px}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}}</style></head><body><header class="topbar"><div><span class="eyebrow">Resumen institucional</span><h1>Estadísticas de Salud Escolar</h1><p>Indicadores generales de la base integrada.</p></div><a href="index.html">Volver al mapa</a></header><main class="stats"><div class="cards"><div class="card"><strong id="sSchools">0</strong>Registros</div><div class="card"><strong id="sEnrollment">0</strong>Matrícula total</div><div class="card"><strong id="sImc">—</strong>IMC promedio</div><div class="card"><strong id="sPriority">—</strong>Prioridad promedio</div></div><h2>Top 10 por prioridad de atención</h2><div class="tablebox"><table><thead><tr><th>Escuela</th><th>CCT</th><th>Ciclo</th><th>Prioridad</th><th>Alertas</th></tr></thead><tbody id="topBody"></tbody></table></div></main><script>const n=v=>v==null?'—':(+v).toLocaleString('es-MX',{maximumFractionDigits:2});fetch('data/salud_escolar.json').then(r=>r.json()).then(d=>{sSchools.textContent=d.length.toLocaleString('es-MX');sEnrollment.textContent=d.reduce((a,r)=>a+(+r.matricula||0),0).toLocaleString('es-MX');let avg=c=>{let x=d.map(r=>+r[c]).filter(Number.isFinite);return x.reduce((a,b)=>a+b,0)/x.length};sImc.textContent=n(avg('imc_promedio'));sPriority.textContent=n(avg('prioridad_atencion'));topBody.innerHTML=[...d].sort((a,b)=>(+b.prioridad_atencion||0)-(+a.prioridad_atencion||0)).slice(0,10).map(r=>`<tr><td>${r.NOM_ESCUELA_ATENCION}</td><td>${r.CVE_ESCUELA_ATENCION}</td><td>${r.REF_CICLO_ESCOLAR}</td><td>${n(r.prioridad_atencion)}</td><td>${n(r.alertas_promedio)}</td></tr>`).join('')})</script></body></html>
